<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Verification Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .val-total { color: var(--accent); }
        .val-success { color: var(--success); }
        .val-warning { color: var(--warning); }
        .val-danger { color: var(--danger); }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            min-width: 300px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 0.8rem 1.5rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow-x: auto;
            animation: fadeInUp 1s ease-out;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        tr {
            transition: background-color 0.2s ease;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .badge-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        a {
            color: var(--accent-hover);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .text-sm { font-size: 0.9rem; }
        .text-muted { color: var(--text-muted); }
        
        .original-ref {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            position: relative;
        }
        
        .original-ref:hover {
            white-space: normal;
            word-break: break-word;
            background: var(--bg-color);
            position: absolute;
            z-index: 20;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Verification Dashboard</h1>
            <p class="subtitle">Real-time insights on your research paper references</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value val-total">212</div>
                <div class="stat-label">Total References</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-success">137</div>
                <div class="stat-label">Verified Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-warning">57</div>
                <div class="stat-label">Requires Manual Review</div>
            </div>
            <div class="stat-card">
                <div class="stat-value val-danger">18</div>
                <div class="stat-label">Not Verified</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search references, authors, or titles...">
            <div class="filters">
                <button class="filter-btn active" data-filter="ALL">All</button>
                <button class="filter-btn" data-filter="AVAILABLE / VERIFIED">Verified</button>
                <button class="filter-btn" data-filter="POSSIBLE MATCH — REQUIRES MANUAL VERIFICATION">Manual Review</button>
                <button class="filter-btn" data-filter="NOT AVAILABLE / NOT VERIFIED">Not Found</button>
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Original Reference</th>
                        <th>Status</th>
                        <th>Found Title</th>
                        <th>Source</th>
                        <th>Links</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data rendered via JS -->
                </tbody>
            </table>
        </div>
    </div>

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentFilter = 'ALL';
        
        function getStatusBadge(status) {
            if(status.includes('VERIFIED') && !status.includes('NOT')) return '<span class="badge badge-success">Verified</span>';
            if(status.includes('POSSIBLE')) return '<span class="badge badge-warning">Review Needed</span>';
            return '<span class="badge badge-danger">Not Found</span>';
        }
        
        function renderTable() {
            const query = searchInput.value.toLowerCase();
            let html = '';
            
            data.forEach((row, index) => {
                // Filtering
                if(currentFilter !== 'ALL' && row.status !== currentFilter) return;
                
                const searchableText = `${row.original_reference} ${row.verified_title} ${row.authors} ${row.doi}`.toLowerCase();
                if(query && !searchableText.includes(query)) return;
                
                const links = row.url ? `<a href="${row.url}" target="_blank">View Paper &nearr;</a>` : '<span class="text-muted">N/A</span>';
                const foundInfo = row.verified_title ? `<strong>${row.verified_title}</strong><br><span class="text-sm text-muted">${row.authors} (${row.year})</span>` : '<span class="text-muted">-</span>';
                
                html += `
                    <tr>
                        <td>${row.no}</td>
                        <td>
                            <div class="original-ref" title="Hover to read full reference">
                                ${row.original_reference}
                            </div>
                        </td>
                        <td>${getStatusBadge(row.status)}</td>
                        <td>${foundInfo}</td>
                        <td><span class="text-sm">${row.source || '-'}</span><br><span class="text-sm text-muted">${row.notes || ''}</span></td>
                        <td>${links}</td>
                    </tr>
                `;
            });
            
            tableBody.innerHTML = html;
        }
        
        // Event Listeners
        searchInput.addEventListener('input', renderTable);
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderTable();
            });
        });
        
        // Initial Render
        renderTable();
    </script>
